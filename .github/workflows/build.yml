name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # 03:17 JST every day (UTC).
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # lib/JUCE is a submodule pinned to this tag; the fetch step below is only a
  # fallback if the submodule checkout leaves lib/JUCE empty.
  JUCE_VERSION: "8.0.8"
  BUILD_CONFIG: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            slug: windows-x64
            # Ninja, not the Visual Studio generator: the VST3 moduleinfo step
            # loads the plugin, which prints "[PatchLoaderJSON] Error: ..." for
            # missing banks, and MSBuild turns any "Error:" line into a failure.
            configure_args: -G Ninja
            targets: 3HSPlug_VST3 3HSPlug_Standalone
          - name: macOS
            os: macos-15
            slug: macos-universal
            configure_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
            targets: 3HSPlug_VST3 3HSPlug_AU 3HSPlug_Standalone

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch JUCE ${{ env.JUCE_VERSION }}
        shell: bash
        run: |
          if [ ! -f lib/JUCE/CMakeLists.txt ]; then
            git clone --depth 1 --branch "$JUCE_VERSION" https://github.com/juce-framework/JUCE.git lib/JUCE
          fi

      - name: Configure plugin
        shell: bash
        run: cmake -S . -B build ${{ matrix.configure_args }} -DCMAKE_BUILD_TYPE=$BUILD_CONFIG

      - name: Build plugin
        shell: bash
        run: cmake --build build --config $BUILD_CONFIG --parallel 4 --target ${{ matrix.targets }}

      - name: Configure tests
        shell: bash
        run: cmake -S test -B build-tests ${{ matrix.configure_args }} -DCMAKE_BUILD_TYPE=$BUILD_CONFIG

      - name: Build tests
        shell: bash
        run: cmake --build build-tests --config $BUILD_CONFIG --parallel 4

      - name: Run tests
        shell: bash
        run: ctest --test-dir build-tests -C $BUILD_CONFIG --output-on-failure

      - name: Check universal binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          art="build/3HSPlug_artefacts/$BUILD_CONFIG"
          for bin in "$art/VST3/3HSPlug.vst3/Contents/MacOS/3HSPlug" \
                     "$art/AU/3HSPlug.component/Contents/MacOS/3HSPlug" \
                     "$art/Standalone/3HSPlug.app/Contents/MacOS/3HSPlug"; do
            lipo -info "$bin"
            lipo "$bin" -verify_arch arm64 x86_64
          done

      - name: Package
        id: package
        shell: bash
        run: |
          art="build/3HSPlug_artefacts/$BUILD_CONFIG"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          elif [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            version=nightly
          else
            version="${GITHUB_SHA::7}"
          fi
          name="3HSPlug-$version-${{ matrix.slug }}"
          stage="dist/$name"
          mkdir -p "$stage"
          mkdir -p "$stage/VST3"
          cp -R "$art/VST3/3HSPlug.vst3" "$stage/VST3/"
          if [ "$RUNNER_OS" = "macOS" ]; then
            mkdir -p "$stage/AU"
            cp -R "$art/AU/3HSPlug.component" "$stage/AU/"
            mkdir -p "$stage/Standalone"
            cp -R "$art/Standalone/3HSPlug.app" "$stage/Standalone/"
          else
            mkdir -p "$stage/Standalone"
            cp "$art/Standalone/3HSPlug.exe" "$stage/Standalone/"
          fi
          cp -R assets "$stage/assets"
          cp README.md README_AssetPaths.md LICENSE "$stage/"
          if [ "$RUNNER_OS" = "macOS" ]; then
            (cd dist && ditto -c -k --keepParent "$name" "$name.zip")
          else
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Upload the zip rather than the bundle tree: artifact uploads drop the
      # symlinks inside macOS .app/.vst3/.component bundles.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "3HSPlug $GITHUB_REF_NAME" \
              --generate-notes
          fi

  nightly:
    name: Nightly pre-release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 3HSPlug-nightly-*
          path: dist
          merge-multiple: true

      - name: Publish nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Move only the rolling nightly tag to the commit actually built.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/nightly -f sha="$GITHUB_SHA"
          fi

          cat > "$RUNNER_TEMP/nightly-notes.md" <<EOF
          Automated development build from main. These files are replaced after each successful nightly build.

          Commit: [$GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)
          Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Includes Windows x64 (VST3/Standalone) and macOS Universal (VST3/AU/Standalone), plus patches and PCM assets.
          EOF

          if gh release view nightly --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload nightly dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit nightly --repo "$GITHUB_REPOSITORY" \
              --title "3HSPlug Nightly" --notes-file "$RUNNER_TEMP/nightly-notes.md" \
              --prerelease --latest=false
          else
            gh release create nightly dist/*.zip --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "3HSPlug Nightly" \
              --notes-file "$RUNNER_TEMP/nightly-notes.md" --prerelease --latest=false
          fi
